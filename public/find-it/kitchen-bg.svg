  <rect x="1178" y="124" width="336" height="166" rx="18" fill="url(#cabinet)" stroke="#1a1f48" stroke-width="8"/>

  <rect x="130" y="160" width="104" height="88" rx="12" fill="#a9dcff" opacity="0.78"/>
