<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="Comic-book sleek kitchen">
  <defs>
    <linearGradient id="skywash" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6aa8ff"/>
      <stop offset="0.48" stop-color="#4666c8"/>
      <stop offset="1" stop-color="#2a2d63"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1f1f46"/>
      <stop offset="1" stop-color="#150f2d"/>
    </linearGradient>
    <linearGradient id="counter" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2b2f73"/>
      <stop offset="0.5" stop-color="#4550a8"/>
      <stop offset="1" stop-color="#20255b"/>
    </linearGradient>
    <linearGradient id="cabinet" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fdde84"/>
      <stop offset="1" stop-color="#c3832d"/>
    </linearGradient>
    <pattern id="dots" x="0" y="0" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="2" fill="rgba(255,255,255,0.16)"/>
      <circle cx="12" cy="12" r="2" fill="rgba(255,255,255,0.1)"/>
    </pattern>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 0.06"/>
      </feComponentTransfer>
    </filter>
  </defs>

  <rect x="0" y="0" width="1600" height="900" fill="url(#skywash)"/>
  <rect x="0" y="560" width="1600" height="340" fill="url(#floor)"/>
  <rect x="0" y="0" width="1600" height="900" fill="url(#dots)" opacity="0.3"/>

  <rect x="84" y="108" width="326" height="178" rx="18" fill="url(#cabinet)" stroke="#1a1f48" stroke-width="8"/>
